<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="build-version" content="__BUILD_VERSION__">
  <meta name="author" content="Niagova">
  <title>Supplier Hub Template Showcase</title>
  <meta name="description" content="Compare four Supplier Hub website concepts in one showcase: Grocery, Spare parts, Marketplace and Boutique.">
  <meta name="theme-color" content="#f6f6f3">
  <meta property="og:title" content="Supplier Hub Template Showcase">
  <meta property="og:image" content="03-marketplace/images/hero.webp">
  <link rel="canonical" href="https://demo-supplier.niagova.com/">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="index.css?v=__BUILD_VERSION__">
</head>
<body>
  <a class="skip-link" href="#templatePreview">Skip to website preview</a>

  <header class="showcase-bar" aria-label="Template preview controls">
    <div class="showcase-identity">
      <a class="showcase-logo" href="https://niagova.com/" target="_blank" rel="noopener"><img src="assets/niagova-logo.svg" alt="Niagova" width="118" height="28"></a>
      <span class="showcase-title">
        <strong>Supplier Hub concepts</strong>
        <small><span>Demo by Niagova</span> · <span id="previewStatus" aria-live="polite">Previewing Grocery</span></small>
      </span>
    </div>

    <nav class="template-tabs" aria-label="Choose a website template">
      <button class="template-tab" type="button" data-template="wholesale" aria-pressed="true"><span>01</span> Grocery</button>
      <button class="template-tab" type="button" data-template="spareparts" aria-pressed="false"><span>02</span> Parts</button>
      <button class="template-tab" type="button" data-template="marketplace" aria-pressed="false"><span>03</span> Marketplace</button>
      <button class="template-tab" type="button" data-template="boutique" aria-pressed="false"><span>04</span> Boutique</button>
    </nav>

    <div class="showcase-actions">
      <a class="open-template" id="openTemplate" href="01-wholesale/index.html" target="_blank" rel="noopener" aria-label="Open this template as a full page in a new tab">
        <span class="open-label">Open full page</span> <span aria-hidden="true">↗</span>
      </a>
      <a class="view-packages" href="https://niagova.com/#pricing" target="_blank" rel="noopener">View packages</a>
    </div>
  </header>

  <main class="preview-shell">
    <iframe id="templatePreview" name="templatePreview" src="01-wholesale/index.html" title="Grocery supplier website template preview"></iframe>
  </main>

  <noscript>
    <div class="no-script">
      JavaScript is needed for the template switcher. Open a template directly:
      <a href="01-wholesale/index.html">Grocery</a>,
      <a href="02-spareparts/index.html">Spare parts</a>,
      <a href="03-marketplace/index.html">Marketplace</a> or
      <a href="04-boutique/index.html">Boutique</a>.
    </div>
  </noscript>

  <script src="index.js?v=__BUILD_VERSION__"></script>
</body>
</html>
