# MyBizGate site configuration. The slug is the permanent identity; the domain may change later.
client:
  name: Supplier Hub
  slug: supplier
template:
  id: 00-empty-template
  version: 1.0.0
platform_ref: v1.7.1
domain:
  type: subdomain
  primary: demo-supplier.niagova.com
business:
  whatsapp: '+601158121239'
  email: sales@niagova.com
  address: Kampung Pandan, 2A Lorong Delapan, 55100 Kuala Lumpur
  opening_hours: 9.00am - 6.00pm
  short_name: Supplier Hub
  locality: Kuala Lumpur
hosting:
  deploy_dir: public_html/demo/supplier/
  ftp_account: dedicated
site:
  kind: demo
  environment: production
  production_url: https://demo-supplier.niagova.com
  identity: Supplier Hub
build:
  exclude: []
  images:
    convert: true
    quality: 82
    max_width: 1920
    preserve: []
  cache_bust: true
qa:
  lighthouse: false
  browser_smoke: false
  screenshots: false
github:
  repo: demo-supplier
  visibility: public
